name: product-catalog-ci
on:
  pull_request:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22
      - name: Build
        run: go build -o product-catalog-service src/product-catalog/main.go
      - name: unit tests
        run: go test src/product-catalog/...
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          run: golangci-lint run
          working-directory: src/product-catalog
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Install docker
        uses: docker/setup-buildx-action@v1
      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Docker push
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/otel-product-catalog:${{github.run_id}}
  updatek8s:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update tag in k8s deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/otel-product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
      - name: Commit and push changes
        run: |
          git config --global user.email "himanshusarma074@gmail.com"
          git config --global user.name "Himanshu Sarma"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI]: Update product catalog image tag"
          git push origin HEAD:main -f